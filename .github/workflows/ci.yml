name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core check
        run: npm run check

      - name: Architecture boundaries
        run: npm run check:deps

      - name: Dependency audit
        run: npm run audit:ci

      - name: Toolchain verification
        run: npm run quality:test

      - name: Toolchain coverage gate
        run: npm run quality:coverage

      - name: Runtime coverage gate
        run: npm run coverage:runtime
